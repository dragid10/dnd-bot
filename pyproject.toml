[project]
name = "dnd-bot"
version = "1.5.0"
description = "Discord bot to manage D&D groups"
authors = [{ name = "Alex Oladele", email = "dragid10@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7",
    "mongoengine",
    "more-itertools",
    "pymongo",  # Needed specifically to do the ping/status command
    "python-decouple",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
]
test = [
    "mongomock",
    "pytest",
    "pytest-randomly",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
